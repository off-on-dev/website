name: Regenerate visual baselines

# Regenerates the 48 committed screenshots in e2e/snapshots/ on ubuntu-latest —
# the same runner the PR e2e job uses — so baselines match CI rendering exactly.
#
# When to trigger (workflow_dispatch from the Actions tab):
#   - After a visual change is intentional (new component, layout update, theme
#     tweak) and you want CI to accept the new appearance as the baseline.
#   - After bumping @playwright/test: update the image tag in `baselines:update`
#     in package.json to match, then trigger this workflow on the branch.
#   - After adding a new route to e2e/visual.spec.ts (otherwise CI fails with
#     "missing snapshot" for those routes).
#
# IMPORTANT: never run `npm run baselines:update` (the local Docker command)
# and then skip this workflow. The Docker command produces linux baselines that
# should match CI; this workflow is the authoritative source and overwrites them.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the branch the workflow was triggered on so the commit
          # lands back on that branch (not a detached HEAD).
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run build

      - run: npx playwright test e2e/visual.spec.ts --update-snapshots

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/snapshots/
          if git diff --staged --quiet; then
            echo "Baselines unchanged — nothing to commit."
          else
            PW_VERSION=$(node -e "const p=require('./node_modules/@playwright/test/package.json');process.stdout.write(p.version)")
            git commit -s -m "chore(e2e): regenerate visual baselines [linux/pw-${PW_VERSION}]"
            git push
            echo "Baselines committed. Re-trigger the PR e2e job to confirm CI passes."
          fi
