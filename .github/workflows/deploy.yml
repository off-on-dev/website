name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 02:00 UTC — ensures deadline-based layout changes are reflected without a code push
    - cron: "0 2 * * *"

permissions:
  contents: read   # All jobs read-only by default; deploy job overrides to write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required by JamesIves/github-pages-deploy-action to push gh-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - run: npm run sync
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit:coverage

      # Astro static build → dist/ (not dist/client/). Astro emits dist/404.html
      # natively, so the old `cp .../404/index.html 404.html` step is gone.
      - run: npm run build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          branch: gh-pages
          folder: dist
          force: false
          clean: true
          clean-exclude: |
            pr-preview/
